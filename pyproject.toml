[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-ag"
version = "0.1.2"
description = "Runtime security & observability guard for AI agents — intercepts LLM calls and tool calls before execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Cerbere AG" }
]
keywords = ["ai", "agents", "security", "llm", "guardrails", "observability", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.28",
    "structlog>=23.0",
    "tiktoken>=0.5",
    "pydantic>=2.0",
]

[project.optional-dependencies]
signing = ["cryptography>=41.0"]
pii = ["presidio-analyzer", "spacy"]

[project.urls]
Homepage = "https://app.cerbereag.site"
Repository = "https://github.com/chrismsmr-celcom/agentguard"

[tool.setuptools]
py-modules = ["agentguard_sdk"]
